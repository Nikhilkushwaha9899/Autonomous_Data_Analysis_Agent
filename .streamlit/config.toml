[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#D2562B"
backgroundColor = "#F7F3EA"
secondaryBackgroundColor = "#EFE8D6"
textColor = "#1B2A27"
linkColor = "#B9441E"
borderColor = "#E4DAC5"

# Fonts load from Google Fonts; the fallbacks are used when offline.
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap, sans-serif"
headingFont = "Fraunces:https://fonts.googleapis.com/css2?family=Fraunces:wght@600&display=swap, Georgia, serif"
headingFontSizes = ["3rem", "2rem", "1.5rem"]
headingFontWeights = [600, 600, 600]
metricValueFontSize = "2rem"

baseRadius = "large"
buttonRadius = "full"
showWidgetBorder = true

chartCategoricalColors = ["#D2562B", "#17302B", "#E3A33B", "#5E8C7B", "#8A5A44", "#B9441E"]

# st.info (the insight callout) uses the "blue" palette, st.success the "green" one.
blueColor = "#D2562B"
blueBackgroundColor = "#FFFDF8"
blueTextColor = "#1B2A27"
greenColor = "#3E7A5A"
greenBackgroundColor = "#E4EEE6"
greenTextColor = "#17302B"

[theme.sidebar]
backgroundColor = "#17302B"
secondaryBackgroundColor = "#20403A"
textColor = "#F1EBDD"
borderColor = "#2C4D46"
linkColor = "#F0A98B"
greenBackgroundColor = "#24544A"
greenTextColor = "#CFE8DA"
redBackgroundColor = "#5A2B27"
redTextColor = "#F7CFC6"
